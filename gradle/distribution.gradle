// Select at build time: -Pdistribution=cf. Runtime configuration cannot enable
// code that is absent from the CurseForge artifact.
def distribution = providers.gradleProperty('distribution').getOrElse('standard')
if (!(distribution in ['standard', 'cf'])) {
    throw new GradleException('distribution must be standard or cf')
}
if (rootProject.mod_version ==~ /.*-cf(?:\.[0-9]+)?/) {
    throw new GradleException('Keep mod_version unsuffixed; use -Pdistribution=cf')
}
ext.distribution = distribution
ext.releaseVersion = rootProject.mod_version + (distribution == 'cf' ? '-cf.1' : '')

subprojects {
    plugins.withId('com.gradleup.shadow') {
        if (project.name in ['fabric', 'neoforge']) {
            // Preserve versioned dependency classes even when Shadow's output is reused from cache.
            tasks.named('jar').configure { manifest.attributes('Multi-Release': 'true') }
            tasks.named('shadowJar').configure {
                // Every supported Minecraft runtime supplies these shared utility libraries.
                dependencies {
                    exclude(dependency('commons-io:commons-io:.*'))
                    exclude(dependency('commons-codec:commons-codec:.*'))
                    // Also supplied by the fixed Minecraft versions supported on this branch.
                    exclude(dependency('org.apache.httpcomponents:httpclient:.*'))
                    exclude(dependency('org.apache.httpcomponents:httpcore:.*'))
                    exclude(dependency('commons-logging:commons-logging:.*'))
                }
                // Upstream command-line examples; no production metadata reader uses these.
                exclude 'org/jaudiotagger/test/**'
                exclude 'org/jaudiotagger/Test.class', 'org/jaudiotagger/Test2.class'
            }
        }
        if (distribution == 'cf' && project.name in ['fabric', 'neoforge']) {
            tasks.named('shadowJar').configure {
                // Only HTTP streams and local audio are used. Remove the unused
                // YouTube implementation and its convenience registration helper.
                exclude 'com/sedmelluq/discord/lavaplayer/source/youtube/**'
                exclude 'com/sedmelluq/discord/lavaplayer/source/AudioSourceManagers.class'
            }
        }
    }
    plugins.withId('java') {
        if (project.name in ['core', 'common']) {
            sourceSets.main.java.srcDir("src/${distribution}/java")
            sourceSets.test.java.srcDir("src/${distribution}Test/java")
        }
        // NeoForge compiles the common sources directly on these branches.
        if (project.name == 'neoforge') {
            sourceSets.main.java.srcDir(project(':common').file("src/${distribution}/java"))
        }
        tasks.withType(Test).configureEach {
            systemProperty 'musichud.test.distribution', distribution
        }
        if (project.name != 'processor') {
            // A real resource input also runs for modules such as Velocity
            // whose resource directory would otherwise be NO-SOURCE.
            def generatedResources = tasks.register('generateDistributionResources') {
                def directory = layout.buildDirectory.dir('generated/distribution-resources')
                inputs.property('distribution', distribution)
                inputs.property('distributionVersion', provider { project.version.toString() })
                outputs.dir(directory)
                doLast {
                    def marker = directory.get().file('META-INF/musichud-distribution.properties').asFile
                    marker.parentFile.mkdirs()
                    marker.setText("distribution=${distribution}\nversion=${project.version}\n", 'UTF-8')
                    if (project.name in ['fabric', 'neoforge']) {
                        def identity = directory.get().file('META-INF/musichud-update.properties').asFile
                        def supported = rootProject.minecraft_version_range.split('-').toList()
                        // Include intermediate versions supported by the published range artifact.
                        if (supported == ['1.21.6', '1.21.8']) supported = ['1.21.6', '1.21.7', '1.21.8']
                        if (supported == ['26.1', '26.1.2']) supported = ['26.1', '26.1.1', '26.1.2']
                        identity.setText("id=musichud_tuneweave\nversion=${project.version}\ndistribution=${distribution}\nloader=${project.name}\nminecraft=${supported.join(',')}\n", 'UTF-8')
                    }
                }
            }
            sourceSets.main.resources.srcDir(generatedResources)
        }
        tasks.named('processResources').configure {
            inputs.property('distribution', distribution)
            inputs.property('distributionVersion', project.version.toString())
            if (distribution == 'cf') {
                doLast {
                    fileTree(destinationDir).matching { include 'assets/musichud_tuneweave/lang/*.json' }.each { file ->
                        def translations = new groovy.json.JsonSlurper().parse(file)
                        translations.keySet().removeIf { key ->
                            key.startsWith('musichud_tuneweave.modal.downloadApiServer') ||
                                    key.startsWith('musichud_tuneweave.button.downloadApiServer') ||
                                    key.startsWith('musichud_tuneweave.modal.clearApiLogs') ||
                                    key in ['musichud_tuneweave.config.apiServer.startupBinaryApiServerWhenLaunch',
                                            'musichud_tuneweave.config.apiServer.serverApiBinaryExecutablePath',
                                            'musichud_tuneweave.config.apiServer.port',
                                            'musichud_tuneweave.button.localApiSetup', 'musichud_tuneweave.text.localApiSetup',
                                            'musichud_tuneweave.button.localApiSetupClose',
                                            'musichud_tuneweave.update.fullEdition', 'musichud_tuneweave.update.goDownload',
                                            'musichud_tuneweave.update.manualDownloadNotice', 'musichud_tuneweave.update.restartNotice']
                        }
                        file.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(translations)) + '\n', 'UTF-8')
                    }
                }
            }
        }
    }
}

apply from: rootProject.file('gradle/verify-distribution.gradle')

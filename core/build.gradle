plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "$rootProject.archives_name-$project.name"
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    compileOnly "org.jetbrains:annotations:26.0.2"
    annotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"
    annotationProcessor project(':processor')
    compileOnly project(':processor')
    testCompileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    testAnnotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"
    testImplementation "org.junit.jupiter:junit-jupiter:$rootProject.junit_version"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    implementation "net.java.dev.jna:jna:5.15.0"
    implementation "org.apache.logging.log4j:log4j-api:2.24.1"
    implementation "org.apache.logging.log4j:log4j-core:2.24.1"
    implementation "org.apache.logging.log4j:log4j-iostreams:2.24.1"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:2.24.1"
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "com.google.guava:guava:33.3.1-jre"
    implementation "io.netty:netty-buffer:4.1.118.Final"
    implementation "io.netty:netty-codec:4.1.118.Final"
    implementation "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"
    implementation "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs += ['-Amusichud.module=' + project.name]
}

test {
    useJUnitPlatform()
    enabled = false
}

tasks.register('verifyNoDesktopMedia') {
    group = 'verification'
    description = 'Keeps desktop media integration out of shared server contracts.'
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    doLast {
        new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile).withCloseable { zip ->
            if (zip.entries().any { it.name.startsWith('io/github/selemba1000/') && it.name.endsWith('.class') }) {
                throw new GradleException('Desktop media implementation must be packaged by common, not core')
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyNoDesktopMedia') }

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories { }
}

plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "$rootProject.archives_name-$project.name"
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    compileOnly "org.jetbrains:annotations:26.0.2"
    annotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"
    annotationProcessor project(':processor')
    compileOnly project(':processor')
    testCompileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    testAnnotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"
    testImplementation "org.junit.jupiter:junit-jupiter:$rootProject.junit_version"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    implementation "org.apache.logging.log4j:log4j-api:2.24.1"
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "com.google.guava:guava:33.3.1-jre"
    implementation "io.netty:netty-buffer:4.1.118.Final"
    implementation "io.netty:netty-codec:4.1.118.Final"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.compilerArgs += ['-Amusichud.module=' + project.name]
}

test {
    useJUnitPlatform { excludeTags 'integration' }
    enabled = true
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories { }
}

modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/MOPELotus/MusicHud-TuneWeave/issues"
license = "LGPL-3.0"

[[mods]]
modId = "musichud_tuneweave"
version = "${version}"
displayName = "MusicHud TuneWeave"
authors = "Etern, MOPELotus"
description = "Client music playback and synchronization powered by TuneWeave | 由 TuneWeave 驱动的客户端音乐播放与同步项目"
displayURL = "https://github.com/MOPELotus/MusicHud-TuneWeave"
logoFile = "assets/musichud_tuneweave/icon.png"

[[dependencies.musichud_tuneweave]]
modId = "neoforge"
type = "required"
versionRange = "[21.11.45,21.12)"
ordering = "NONE"
side = "BOTH"

[[dependencies.musichud_tuneweave]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.11,1.21.12)"
ordering = "NONE"
side = "BOTH"

[[dependencies.musichud_tuneweave]]
modId = "modernui"
type = "required"
reason = """
ModernUI is missing or too old. Install the independent ModernUI-MC port 3.13.0.9 or newer for your Minecraft version.
未安装 ModernUI 或版本过低。请安装与当前 Minecraft 版本匹配的独立 ModernUI-MC port 3.13.0.9 或更新版本。
https://github.com/MOPELotus/ModernUI-MC/releases"""
versionRange = "[3.13.0.9,)"
ordering = "AFTER"
side = "CLIENT"


[[dependencies.musichud_tuneweave]]
modId = "music_hud"
type = "incompatible"
reason = "MusicHud TuneWeave cannot run with upstream MusicHud (music_hud). Remove upstream MusicHud."
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "musichud_tuneweave.mixins.json"

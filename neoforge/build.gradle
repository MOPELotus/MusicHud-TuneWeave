plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'com.gradleup.shadow'
}

base {
    archivesName = "$rootProject.archives_name-$project.name"
}

sourceSets {
    main {
        java {
            srcDir project(':common').file('src/main/java')
        }
        resources {
            srcDir project(':common').file('src/main/resources')
        }
    }
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name "JitPack"
        url 'https://jitpack.io'
    }
    maven {
        name "IzzelAliz Maven"
        url "https://maven.izzel.io/releases/"
    }
    flatDir {
        dir rootProject.file('libs')
    }
    maven {
        name = 'dv8tion'
        url = 'https://m2.dv8tion.net/releases'
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    coreLib {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common, coreLib
    runtimeClasspath.extendsFrom common, coreLib

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

neoForge {
    version = rootProject.neoforge_version
    addModdingDependenciesTo(sourceSets.test)

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "$rootProject.archives_name" {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
    }
}

dependencies {
    // ModernUI Fork supplies TinyFD and its natives at runtime on 26.3.
    compileOnly "org.lwjgl:lwjgl-tinyfd:3.4.3"

    common(project(':common')) { transitive = false }
    coreLib(project(path: ':core')) { transitive = false }
    shadowBundle(project(':common')) { transitive = false }
    shadowBundle(project(path: ':core')) { transitive = false }

    compileOnly "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    compileOnly(project(path: ":processor"))

    compileOnly "io.github.mopelotus.modernui:ModernUI-NeoForge:$rootProject.modernui_fork_version@jar"
    implementation("dev.icyllis:modernui-core:$rootProject.modernui_version") {
        exclude group: "org.slf4j", module: "slf4j-api"
        exclude group: "org.apache.logging.log4j", module: "log4j-core"
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
        exclude group: "com.google.code.findbugs", module: "jsr305"
        exclude group: "org.jetbrains", module: "annotations"
        exclude group: "com.ibm.icu", module: "icu4j"
        exclude group: "it.unimi.dsi", module: "fastutil"
    }
    implementation("icyllis.modernui:ModernUI-Markflow:$rootProject.modernui_version") {
        exclude group: "org.slf4j", module: "slf4j-api"
        exclude group: "org.apache.logging.log4j", module: "log4j-core"
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
        exclude group: "com.google.code.findbugs", module: "jsr305"
        exclude group: "org.jetbrains", module: "annotations"
        exclude group: "com.ibm.icu", module: "icu4j"
        exclude group: "it.unimi.dsi", module: "fastutil"
        exclude group: "org.commonmark"
    }

    implementation "dev.arbjerg:lavaplayer:$rootProject.lavaplayer_version"
    shadowBundle "dev.arbjerg:lavaplayer:$rootProject.lavaplayer_version"

    compileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    compileOnly project(':processor')
    annotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"
    annotationProcessor project(':processor')
    testCompileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    testAnnotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"
    testImplementation "org.junit.jupiter:junit-jupiter:$rootProject.junit_version"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

//    implementation "io.github.selemba1000:JavaMediaTransportControls:$rootProject.jmtc_version"
//    shadowBundle "io.github.selemba1000:JavaMediaTransportControls:$rootProject.jmtc_version"
    implementation "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"
    shadowBundle "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"
    implementation "com.google.zxing:core:3.5.4"
    shadowBundle "com.google.zxing:core:3.5.4"

    implementation "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"
    shadowBundle "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"
    implementation("org.apache.xmlgraphics:batik-transcoder:1.17") {
        // Java 25 provides the XML APIs from java.xml. Bundling xml-apis
        // creates duplicate org.w3c.dom/javax.xml classes in the loader.
        exclude group: "xml-apis", module: "xml-apis"
    }
    shadowBundle("org.apache.xmlgraphics:batik-transcoder:1.17") {
        exclude group: "xml-apis", module: "xml-apis"
    }
    implementation("org.apache.xmlgraphics:batik-codec:1.17") {
        exclude group: "xml-apis", module: "xml-apis"
    }
    shadowBundle("org.apache.xmlgraphics:batik-codec:1.17") {
        exclude group: "xml-apis", module: "xml-apis"
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Amusichud.module=' + project.name]
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    // Lavaplayer owns this Jackson copy; Minecraft may provide a different version.
    relocate 'com.fasterxml.jackson', 'indi.mopelotus.musichud.shaded.jackson'
    mergeServiceFiles { setIncludes(['META-INF/services/com.fasterxml.jackson.*']) }
    exclude 'org/slf4j/**'
}

jar {
    dependsOn shadowJar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(zipTree(shadowJar.archiveFile))
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

// Verify the processed loader metadata with the same parser and version rules as FML.
tasks.named('test', Test) {
    useJUnitPlatform()
    dependsOn tasks.named('processResources')
    systemProperty 'musichud.test.neoMetadata', layout.buildDirectory.file('resources/main/META-INF/neoforge.mods.toml').get().asFile.absolutePath
    systemProperty 'musichud.test.neoforgeVersion', rootProject.neoforge_version
    systemProperty 'musichud.test.minecraftVersion', rootProject.minecraft_version
}

apply from: rootProject.file('gradle/verify-shaded-jackson.gradle')

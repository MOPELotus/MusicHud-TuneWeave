plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.12'
    id 'com.gradleup.shadow'
    id 'maven-publish'
}

base {
    archivesName = "$rootProject.archives_name-$project.name"
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name "IzzelAliz Maven"
        url "https://maven.izzel.io/releases/"
    }
    maven {
        name "JitPack"
        url 'https://jitpack.io'
    }
    flatDir {
        dir rootProject.file('libs')
    }
    maven {
        name = 'dv8tion'
        url = 'https://m2.dv8tion.net/releases'
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    coreLib {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common, coreLib
    runtimeClasspath.extendsFrom common, coreLib

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "com.twelvemonkeys.imageio:imageio-webp:3.13.1"
    shadowBundle "com.twelvemonkeys.imageio:imageio-webp:3.13.1"
    minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    coreLib(project(path: ':core')) { transitive = false }
    shadowBundle(project(path: ':core')) { transitive = false }

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'namedElements')) { transitive = false }

    modImplementation "maven.modrinth:modmenu:$rootProject.modmenu_version"

    modCompileOnly "maven.modrinth:modernui-mc-mvus:$rootProject.modernui_fabric_version"
    implementation("icyllis.modernui:ModernUI-Core:$rootProject.modernui_version") {
        exclude group: "org.slf4j", module: "slf4j-api"
        exclude group: "org.apache.logging.log4j", module: "log4j-core"
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
        exclude group: "com.google.code.findbugs", module: "jsr305"
        exclude group: "org.jetbrains", module: "annotations"
        exclude group: "com.ibm.icu", module: "icu4j"
        exclude group: "it.unimi.dsi", module: "fastutil"
    }
    implementation("icyllis.modernui:ModernUI-Markflow:$rootProject.modernui_version") {
        exclude group: "org.slf4j", module: "slf4j-api"
        exclude group: "org.apache.logging.log4j", module: "log4j-core"
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
        exclude group: "com.google.code.findbugs", module: "jsr305"
        exclude group: "org.jetbrains", module: "annotations"
        exclude group: "com.ibm.icu", module: "icu4j"
        exclude group: "it.unimi.dsi", module: "fastutil"
        exclude group: "org.commonmark"
    }
    implementation project(path: ':metadata', configuration: 'shadowRuntimeElements')
    shadowBundle(project(path: ':metadata', configuration: 'shadowRuntimeElements')) { transitive = false }
    implementation(project(path: ':audio-codecs', configuration: 'shadowRuntimeElements')) { transitive = false }
    shadowBundle(project(path: ':audio-codecs', configuration: 'shadowRuntimeElements')) { transitive = false }
    implementation(project(path: ':audio-containers', configuration: 'shadowRuntimeElements')) { transitive = false }
    shadowBundle(project(path: ':audio-containers', configuration: 'shadowRuntimeElements')) { transitive = false }
    implementation 'io.github.overplex:libresample4j:0.1.4'
    shadowBundle 'io.github.overplex:libresample4j:0.1.4'

//    implementation "io.github.selemba1000:JavaMediaTransportControls:$rootProject.jmtc_version"
//    shadowBundle "io.github.selemba1000:JavaMediaTransportControls:$rootProject.jmtc_version"
    implementation "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"
    shadowBundle "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"
    implementation "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"
    shadowBundle "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"
    implementation "com.github.weisj:jsvg:2.2.0"
    shadowBundle "com.github.weisj:jsvg:2.2.0"

    compileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    annotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"
    annotationProcessor project(':processor')
    testCompileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    testAnnotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"
    testImplementation "org.junit.jupiter:junit-jupiter:$rootProject.junit_version"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

sourceSets {
    main {
        resources {
            srcDir project(':common').file('src/main/resources')
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Amusichud.module=' + project.name]
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    // Minimize only the directly instantiated WebP codec; keep reflection-based dependencies intact.
    minimize {
        exclude { !it.moduleGroup.startsWith("com.twelvemonkeys.") }
    }
    sourceSetsClassesDirs.from(project(":common").sourceSets.main.output.classesDirs)
    relocate 'com.laszlosystems.libresample4j', 'indi.mopelotus.musichud.shaded.resample'
    relocate 'com.github.weisj.jsvg', 'indi.mopelotus.musichud.shaded.jsvg'
    relocate 'com.twelvemonkeys', 'indi.mopelotus.musichud.shaded.twelvemonkeys'
    // The private WebP reader is instantiated explicitly, without global ImageIO registration.
    exclude 'META-INF/services/javax.imageio.spi.*'
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    exclude 'org/slf4j/**'
}

jar {
    // Shadow owns every project class so relocated callers cannot lose to raw source output.
    // NeoForge compiles common sources into this project's main classes directory as well.
    eachFile { details ->
        if (details.path.endsWith('.class') && sourceSets.main.output.classesDirs.files.any {
            details.file.toPath().toAbsolutePath().normalize().startsWith(it.toPath().toAbsolutePath().normalize())
        }) {
            details.exclude()
        }
    }
    dependsOn shadowJar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(zipTree(shadowJar.archiveFile))
}

loom {
    runs {
        client {
            setRunDirectory file("../fabric/run/client")
            jvmArguments.addAll(
                    "-Dmusichud-tuneweave.log.level=DEBUG",
                    "-Dfabric.dli.config=${rootProject.rootDir}/.gradle/loom-cache/projects/${project.name}/launch.cfg"
            )
        }
        server {
            setRunDirectory file("../fabric/run/server")
            jvmArguments.addAll(
                    "-Dmusichud-tuneweave.log.level=DEBUG",
                    "-Dfabric.dli.config=${rootProject.rootDir}/.gradle/loom-cache/projects/${project.name}/launch.cfg"
            )
        }
    }
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

apply from: rootProject.file('gradle/verify-java-audio-dependencies.gradle')

apply from: rootProject.file('gradle/verify-shaded-webp.gradle')

tasks.withType(Test).configureEach {
    systemProperty 'musichud.test.fabricMetadata', layout.buildDirectory.file('resources/main/fabric.mod.json').get().asFile.absolutePath
}

tasks.withType(Test).configureEach { useJUnitPlatform() }
apply from: rootProject.file('gradle/verify-shaded-svg.gradle')

apply from: rootProject.file('gradle/verify-shaded-qr.gradle')

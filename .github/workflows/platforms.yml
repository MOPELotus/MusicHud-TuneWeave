name: Platform publishing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Inspect access, prepare artifacts, or publish all verified files'
        type: choice
        options: [inspect, prepare, publish]
        default: inspect
      tag:
        description: 'Existing GitHub Release tag'
        type: string
        default: v1.3.0-beta-3
      target:
        description: 'Platforms to publish to'
        type: choice
        options: [all, modrinth, curseforge, hangar]
        default: all
      prepared_run:
        description: 'Optional successful prepare run ID; reuse its identical artifacts'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: platform-publishing
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/26.2'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.validate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate dispatch and optional prepared run
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PLATFORM_TARGET: ${{ inputs.target }}
          PREPARED_RUN: ${{ inputs.prepared_run }}
        run: python .github/scripts/platform_release.py validate-dispatch --tag "$RELEASE_TAG" --target "$PLATFORM_TARGET" --prepared-run "$PREPARED_RUN"

  inspect:
    if: github.ref == 'refs/heads/26.2' && inputs.mode == 'inspect'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test automation contracts
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Inspect authenticated project metadata
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: python .github/scripts/platform_release.py inspect
      - uses: actions/upload-artifact@v4
        with:
          name: platform-inspection
          path: platform-report/
          if-no-files-found: error

  prepare:
    needs: dispatch
    if: inputs.mode != 'inspect' && inputs.prepared_run == ''
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test automation contracts
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Verify the published standard release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python .github/scripts/platform_release.py prepare --tag "$RELEASE_TAG" --output bundle
      - uses: actions/upload-artifact@v4
        with:
          name: platform-standard
          path: bundle/standard/
          if-no-files-found: error

  publish:
    needs: [dispatch, assemble]
    if: >-
      always() && needs.dispatch.result == 'success' && inputs.mode == 'publish' &&
      (needs.assemble.result == 'success' || inputs.prepared_run != '')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dispatch.outputs.matrix) }}
    name: Publish ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test publication contracts
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: actions/download-artifact@v4
        with:
          name: platform-bundle
          path: bundle
          run-id: ${{ inputs.prepared_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Upload the verified runtime JARs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          MODRINTH_TOKEN: ${{ matrix.platform == 'modrinth' && secrets.MODRINTH_TOKEN || '' }}
          CURSEFORGE_TOKEN: ${{ matrix.platform == 'curseforge' && secrets.CURSEFORGE_TOKEN || '' }}
          HANGAR_API_TOKEN: ${{ matrix.platform == 'hangar' && secrets.HANGAR_API_TOKEN || '' }}
        run: python .github/scripts/platform_release.py publish --tag "$RELEASE_TAG" --platform "$PLATFORM" --input bundle --output platform-report
      - name: Preserve upload receipts for verification and retries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-receipt-${{ inputs.tag }}-${{ matrix.platform }}
          path: platform-report/receipt.json
          if-no-files-found: warn
          overwrite: true

  cf-build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: CF runtime JARs for ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Force tests and build final CF deployment JARs
        env:
          BUILD_ENTRY: ${{ toJSON(matrix) }}
          JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2'
        run: python automation/.github/scripts/build_release.py build --source source --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: cf-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-tests-${{ matrix.id }}
          path: |
            source/**/build/test-results/**/*.xml
            source/**/build/reports/tests/**
          if-no-files-found: ignore

  assemble:
    needs: [prepare, cf-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: platform-standard
          path: bundle/standard
      - uses: actions/download-artifact@v4
        with:
          pattern: cf-*
          path: cf-builds
      - name: Verify all platform files against the release source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python .github/scripts/platform_release.py assemble --tag "$RELEASE_TAG" --output bundle --input cf-builds
      - uses: actions/upload-artifact@v4
        with:
          name: platform-bundle
          path: bundle/
          if-no-files-found: error

name: Companion service

on:
  push:
    branches: ['companion']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: companion-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test and package Windows x64 application
        run: .\gradlew.bat test protocol:test bundleCompanion -PdesktopPlatform=windows --rerun-tasks --console=plain
      - name: Check launcher and bundle identity (no graphical acceptance)
        shell: pwsh
        run: |
          $root = (Resolve-Path build/package/Companion).Path
          $process = Start-Process -FilePath "$root/Companion.exe" -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/companion-version.txt"
          if ($process.ExitCode -ne 0) { throw "Companion launcher exited with $($process.ExitCode)" }
          $identity = Get-Content "$root/companion.json" -Raw | ConvertFrom-Json
          $version = (Get-Content "$env:RUNNER_TEMP/companion-version.txt" -Raw).Trim()
          if ($version -ne $identity.version) { throw 'Launcher version does not match identity' }
          if ($identity.sourceCommit -ne $env:GITHUB_SHA) { throw 'Bundle source commit does not match checkout' }
          $manifest = Get-Content build/distributions/companion-manifest.json -Raw | ConvertFrom-Json
          $archive = Get-Item "build/distributions/$($manifest.archive)"
          if ($archive.Length -ne $manifest.size) { throw 'Archive size mismatch' }
          if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.sha256) { throw 'Archive checksum mismatch' }
          if (!(Test-Path "$root/runtime/release")) { throw 'Missing bundled Java runtime' }
          if (!(Test-Path "$root/licenses/license")) { throw 'Missing license' }
      - uses: actions/upload-artifact@v4
        with:
          name: Companion-windows-x64
          path: |
            build/distributions/Companion-*-windows-x64.zip
            build/distributions/companion-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Companion-test-results
          path: |
            build/reports/tests/
            protocol/build/reports/tests/
